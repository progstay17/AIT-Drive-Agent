name: Agent checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Agent JavaScript syntax
        run: npm run check
